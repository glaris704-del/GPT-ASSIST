
name: Build GPT ASSIST APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: unzip -o GPT-ASSIST_GPT_ASSIST_Android_Starter_v2.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p GPT_ASSIST_Android_Starter assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GPT-ASSIST-APK
          path: GPT_ASSIST_Android_Starter/app/build/outputs/apk/debug/app-debug.apk
