
      - name: Fix Java and Kotlin versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("GPT_ASSIST_Android_Starter/app/build.gradle")
          s = p.read_text()

          s = re.sub(
              r'sourceCompatibility\s+JavaVersion\.VERSION_1_8',
              'sourceCompatibility JavaVersion.VERSION_17', s)
          s = re.sub(
              r'targetCompatibility\s+JavaVersion\.VERSION_1_8',
              'targetCompatibility JavaVersion.VERSION_17', s)
          s = re.sub(
              r'jvmTarget\s*=\s*["\']1\.8["\']',
              "jvmTarget = '17'", s)

          p.write_text(s)
          print(s)
          PY
