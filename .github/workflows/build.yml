
name: Build GPT ASSIST APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*starter*v2*.zip' | head -n 1)
          unzip -o "$ZIP_FILE"

      - name: Fix runOnUiThread
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("GPT_ASSIST_Android_Starter/app/src/main/java/com/example/gptassist/MainActivity.kt")
          s = p.read_text()
          if "private fun runOnUiThread" not in s:
              lines = s.splitlines()
              i = next(i for i, line in enumerate(lines) if line.startswith("package "))
              lines[i+1:i+1] = [
                  "",
                  "private fun runOnUiThread(action: () -> Unit) {",
                  "    android.os.Handler(android.os.Looper.getMainLooper()).post(action)",
                  "}",
                  ""
              ]
              p.write_text("\n".join(lines) + "\n")
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p GPT_ASSIST_Android_Starter assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GPT-ASSIST-APK
          path: GPT_ASSIST_Android_Starter/app/build/outputs/apk/debug/app-debug.apk
