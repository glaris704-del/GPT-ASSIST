
name: Build GPT ASSIST APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*starter*v2*.zip' | head -n 1)
          unzip -o "$ZIP_FILE"

      - name: Fix Java and Kotlin versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("GPT_ASSIST_Android_Starter/app/build.gradle")
          s = p.read_text()
          needle = "\ndependencies {"
          i = s.index(needle)
          j = s.rfind("\n}", 0, i)
          s = s[:j] + """
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          """ + s[j:]
          p.write_text(s)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p GPT_ASSIST_Android_Starter assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GPT-ASSIST-APK
          path: GPT_ASSIST_Android_Starter/app/build/outputs/apk/debug/app-debug.apk
